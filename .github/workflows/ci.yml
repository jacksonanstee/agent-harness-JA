name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The gate sequence lives in gates.yml, which the publish path calls too
  # (ADR-0022 R6). Adding a gate there adds it to both paths at once, which is
  # the point: the deploy gate can no longer drift weaker than the PR gate.
  #
  # This job is named `test` so its check contexts read `test / build-test (20)`
  # and `test / docs-links`. Renaming it renames the required status checks in
  # branch protection — update those in the same change or every PR blocks.
  #
  # No `secrets: inherit` (see the gates.yml invariants).
  test:
    uses: ./.github/workflows/gates.yml
