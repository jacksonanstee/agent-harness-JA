name: Publish

# Publishes to npm via OIDC Trusted Publishing (no long-lived token) with
# build provenance. Triggered by publishing a GitHub Release, so the human
# gate is the release itself. See ADR-0022 for the one-time npm-side setup
# (link the trusted publisher: npmjs.com package settings -> Trusted Publisher
# -> GitHub Actions -> this repo + this workflow filename).
#
# The dependency-executing work is split away from the token on purpose
# (ADR-0022 amendment, audit finding V20): GitHub injects OIDC-minting
# credentials into EVERY step of a job that holds id-token: write, so a single
# job would let dependency code running during npm ci / build / test mint a
# publish token before the publish step ever ran. Those gates run in
# gates.yml with contents: read only; the publish job holds id-token and runs
# no dependency code (no npm ci, --ignore-scripts), its one disclosed
# exception being the pinned npm self-upgrade. A called workflow can only
# DOWNGRADE the caller's permissions, never elevate them, so the gates cannot
# reach id-token: write even if gates.yml asked for it.
#
# INVARIANT: the `npm publish` step stays in a job defined INLINE in this file.
# npm binds trusted publishing to repo + workflow filename, and does not
# support a reusable workflow as the publishing workflow. Moving this job into
# a workflow_call callee would change its job_workflow_ref claim and break the
# binding. Renaming or moving this file breaks it the same way.

on:
  release:
    types: [published]

# Least privilege default for all jobs; the publish job alone widens to
# id-token: write (job-level permissions REPLACE this block, so it restates
# contents: read for its checkout).
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Guard: the published version must match the release tag (tag vX.Y.Z), so a
  # forgotten version bump fails loudly instead of re-publishing. Release tags
  # follow the vX.Y.Z convention, so the guard prepends 'v' to the package
  # version. A tag without the 'v' fails closed here (safe): fix the tag, do
  # not drop the 'v'.
  # Its own job, and first: it needs only a checkout, so it stops a forgotten
  # bump in seconds rather than after the several minutes of install/build/
  # test. Deliberately no setup-node and no cache: npm — it installs nothing,
  # so a cache restore would be pure waste (jq ships on ubuntu-latest).
  verify-tag:
    runs-on: ubuntu-latest
    # Skip GitHub pre-releases: publish has no --tag, so a pre-release would
    # otherwise land on the npm 'latest' dist-tag. Cut a normal release to
    # ship. Every other job needs this one transitively, so skipping here
    # skips the whole run.
    if: ${{ !github.event.release.prerelease }}
    steps:
      # Actions pinned by full commit SHA (supply-chain hardening): a moved tag
      # cannot silently swap the action out from under a publish.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TAG comes in via env, never interpolated into the script body: a
      # ${{ }} expression substituted into the shell text would let a crafted
      # tag name inject commands into this workflow.
      - name: Verify version matches release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="v$(jq -r .version package.json)"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version $PKG_VERSION does not match release tag $TAG" >&2
            exit 1
          fi

  # The same gate sequence PR CI runs, from the same file, so the deploy path
  # cannot be weaker than the PR path (ADR-0022 R6). Node 22 only here, and
  # upload-dist on: this is the run whose dist/ the publish job consumes.
  # Note this now waits on the docs-links gate too, so a broken relative doc
  # link blocks a release. That is the intended strict direction.
  # No `secrets: inherit` (see the gates.yml invariants).
  gates:
    needs: verify-tag
    uses: ./.github/workflows/gates.yml
    with:
      node-versions: '["22"]'
      upload-dist: true

  publish:
    runs-on: ubuntu-latest
    # INVARIANT: no `if: always()` here. A failed or skipped gate (including
    # the pre-release skip, which cascades from verify-tag) must skip this job,
    # which the default success() condition on needs gives us. A `uses:` job
    # succeeds only if every job inside the called workflow succeeded.
    needs: gates
    # Manual-approval gate. GitHub auto-creates a referenced environment with
    # NO protection rules, so this is inert until required reviewers are added
    # in repo Settings -> Environments. See ADR-0022 residuals: with trusted
    # publishing, "can cut a release on this repo" is the whole publish
    # authority, and this reviewer is the only independent check on it.
    environment: npm-publish
    # The ONLY job holding id-token: write. It runs no dependency code:
    # checkout is this repo's own release commit, there is no npm ci, and
    # --ignore-scripts keeps prepublishOnly (clean rebuild + gates, which the
    # gates job already ran as visible steps) from pulling devDependency
    # execution back into token scope. The one disclosed exception is the
    # pinned npm self-upgrade below (ADR-0022 amendment residual).
    # Job permissions REPLACE the workflow block, so contents: read is
    # restated for the checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # INVARIANT: no `cache: npm` in this job. A cache restore inside token
      # scope is a poisoning channel from lower-privileged workflows that can
      # write the shared cache. This job installs nothing it could cache.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the Node 22 runner ships
      # an older npm, so upgrade before publish. Pinned (not @latest): this is
      # the one network pull that runs in the job holding the OIDC publish
      # capability, so it gets the same pin discipline as the SHA-pinned
      # actions. Bump deliberately; must stay >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.11.0

      # INVARIANT: no `github-token` or `run-id` inputs here. Without them this
      # action can only read artifacts from THIS run, which is what makes the
      # gates -> publish handoff unforgeable (artifacts are immutable once
      # finalised, and only this run's gates job could have written them).
      # The gates job now lives in a called workflow, but jobs of a locally
      # called workflow belong to the SAME run, so the argument is unchanged.
      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Loud-fail guard: if the artifact did not land, `npm publish` from this
      # directory would pack a tarball WITHOUT dist/ (the files allowlist just
      # skips missing entries) and ship a broken package. Checking the two
      # entry points npm's own pack machinery will include makes that
      # impossible to miss.
      - name: Verify build artifact landed
        run: |
          test -s dist/index.js
          test -s dist/cli.js

      - name: Publish to npm (provenance + OIDC)
        run: npm publish --provenance --access public --ignore-scripts
